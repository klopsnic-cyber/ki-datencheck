[package]
name = "ki-datencheck"
version = "0.1.1"
description = "KI-Datencheck: prüft Texte und Dateien auf personenbezogene Daten, bevor sie in eine KI gehen"
authors = ["infralatis"]
license = "MIT"
edition = "2024"

[lib]
name = "kidatencheck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13.1"
pdf-extract = "0.12.1"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
